services:
  guides:
    image: nginx:1.27-alpine
    container_name: edgible-guides
    restart: unless-stopped
    # Loopback only. Edgible publishes this; the port is never forwarded.
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
