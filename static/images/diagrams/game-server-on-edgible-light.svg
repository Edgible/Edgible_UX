<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-labelledby="t d">
<title id="t">Friends on PC and on phone reach two hostnames: mc-java on TCP port 25565 and mc-bedrock on UDP port 29132, both open to anyone. Both arrive at one Minecraft server on one machine you own, with Paper on 127.0.0.1:25565 and Geyser on 127.0.0.1:29132, and no forwarded port.</title>
<desc id="d">Friends on PC and on phone reach two hostnames: mc-java on TCP port 25565 and mc-bedrock on UDP port 29132, both open to anyone. Both arrive at one Minecraft server on one machine you own, with Paper on 127.0.0.1:25565 and Geyser on 127.0.0.1:29132, and no forwarded port.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c2c8d8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="306" rx="10" fill="#e4e8f2"/>
<rect class="card" x="36" y="93" width="112" height="120" rx="8"/>
<text class="label" x="92" y="139" text-anchor="middle">Friends</text>
<text class="small" x="92" y="159" text-anchor="middle">on PC</text>
<text class="small" x="92" y="177" text-anchor="middle">and phone</text>
<rect class="card" x="250" y="86" width="250" height="58" rx="8"/>
<rect x="250" y="86" width="6" height="58" rx="3" fill="#2f6fb0"/>
<text class="mono" x="272" y="112">mc-java.&lt;org&gt;…:25565</text>
<text class="small" x="272" y="132">open to anyone</text>
<path d="M148 149 C 200 149, 200 115, 250 115" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<rect class="card" x="250" y="162" width="250" height="58" rx="8"/>
<rect x="250" y="162" width="6" height="58" rx="3" fill="#2f6fb0"/>
<text class="mono" x="272" y="188">mc-bedrock.&lt;org&gt;…:29132</text>
<text class="small" x="272" y="208">open to anyone</text>
<path d="M148 157 C 200 157, 200 191, 250 191" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<rect class="card" x="612" y="40" width="340" height="226" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">ONE MACHINE YOU OWN</text>
<text class="monoxs" x="632" y="100">127.0.0.1:25565</text>
<text class="monoxs" x="758" y="100">Paper, TCP</text>
<text class="monoxs" x="632" y="126">127.0.0.1:29132</text>
<text class="monoxs" x="758" y="126">Geyser, UDP</text>
<line x1="632" y1="140" x2="932" y2="140" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="158">one server, two protocols</text>
<text class="small" x="632" y="184">the whitelist decides who plays</text>
<text class="small" x="632" y="210">router: no forwarded port</text>
<path d="M612 153 H512" fill="none" stroke="#000033" stroke-width="2.5"/>
<text class="small" x="556" y="143" text-anchor="middle">outbound 443</text>
