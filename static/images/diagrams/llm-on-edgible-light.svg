<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-labelledby="t d">
<title id="t">An n8n VM and an OpenClaw VM on other machines call ollama.&lt;org&gt;.edgible.com with a bearer key. It arrives at Ollama on the Mac, bound to 127.0.0.1:11434 and reached through a forwarder on the guest, so the model weights and the GPU stay home and the router has no forwarded port.</title>
<desc id="d">An n8n VM and an OpenClaw VM on other machines call ollama.&lt;org&gt;.edgible.com with a bearer key. It arrives at Ollama on the Mac, bound to 127.0.0.1:11434 and reached through a forwarder on the guest, so the model weights and the GPU stay home and the router has no forwarded port.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c9cdd8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="306" rx="10" fill="#f4f5f7"/>
<rect class="card" x="36" y="93" width="112" height="120" rx="8"/>
<text class="label" x="92" y="139" text-anchor="middle">n8n VM</text>
<text class="small" x="92" y="159" text-anchor="middle">and OpenClaw,</text>
<text class="small" x="92" y="177" text-anchor="middle">on other boxes</text>
<rect class="card" x="250" y="124" width="250" height="58" rx="8"/>
<rect x="250" y="124" width="6" height="58" rx="3" fill="#7a5cc0"/>
<text class="mono" x="272" y="150">ollama.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="170">bearer key</text>
<path d="M148 153 C 200 153, 200 153, 250 153" fill="none" stroke="#8a90a6" stroke-width="2" stroke-dasharray="5 4"/>
<rect class="card" x="612" y="40" width="312" height="226" rx="8"/>
<path d="M620 40 h296 a8 8 0 0 1 8 8 v22 h-312 v-22 a8 8 0 0 1 8 -8 z" fill="#000033"/>
<text class="head" x="632" y="60">THE GPU STAYS HOME</text>
<text class="monoxs" x="632" y="100">127.0.0.1:11434</text>
<text class="monoxs" x="762" y="100">Ollama on the Mac</text>
<text class="monoxs" x="632" y="126">guest forwarder</text>
<text class="monoxs" x="762" y="126">socat to the Mac</text>
<line x1="632" y1="140" x2="904" y2="140" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="158">weights never leave the machine</text>
<text class="small" x="632" y="184">Authorization: Bearer, not an open port</text>
<text class="small" x="632" y="210">router: no forwarded port</text>
<path d="M612 153 H512" fill="none" stroke="#000033" stroke-width="2.5"/>
<text class="small" x="556" y="143" text-anchor="middle">dials out on 443</text>
</svg>
