<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 254" width="960" height="254" role="img" aria-labelledby="t d">
<title id="t">The n8n editor is published as n8n.&lt;org&gt;.edgible.com behind an org login, and chapter 3 adds an open webhook hostname. Both arrive at the one n8n process on 127.0.0.1:5678 on the Ubuntu guest.</title>
<desc id="d">The n8n editor is published as n8n.&lt;org&gt;.edgible.com behind an org login, and chapter 3 adds an open webhook hostname. Both arrive at the one n8n process on 127.0.0.1:5678 on the Ubuntu guest.</desc>
