<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
<title id="t">A phone on cellular reaches hello-world.&lt;org&gt;.edgible.com, which is open to anyone. It arrives at one machine you own, where Hello World is bound to 127.0.0.1:8080 and the serving agent holds an outbound connection on 443, so the router has no forwarded port.</title>
<desc id="d">A phone on cellular reaches hello-world.&lt;org&gt;.edgible.com, which is open to anyone. It arrives at one machine you own, where Hello World is bound to 127.0.0.1:8080 and the serving agent holds an outbound connection on 443, so the router has no forwarded port.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c2c8d8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="280" rx="10" fill="#e4e8f2"/>
<rect class="card" x="36" y="80" width="112" height="120" rx="8"/>
<text class="label" x="92" y="126" text-anchor="middle">Phone</text>
<text class="small" x="92" y="146" text-anchor="middle">cellular</text>
<text class="small" x="92" y="164" text-anchor="middle">Wi-Fi off</text>
<rect class="card" x="250" y="111" width="250" height="58" rx="8"/>
<rect x="250" y="111" width="6" height="58" rx="3" fill="#2f6fb0"/>
<text class="mono" x="272" y="137">hello-world.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="157">open to anyone</text>
<path d="M148 140 C 200 140, 200 140, 250 140" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<rect class="card" x="612" y="40" width="340" height="200" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">ONE MACHINE YOU OWN</text>
<text class="monoxs" x="632" y="100">127.0.0.1:8080</text>
<text class="monoxs" x="758" y="100">Hello World</text>
<line x1="632" y1="114" x2="932" y2="114" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="132">the agent connects out, nothing connects in</text>
<text class="small" x="632" y="158">router: no forwarded port</text>
<text class="small" x="632" y="184">nothing listens on the LAN</text>
<path d="M612 140 H512" fill="none" stroke="#000033" stroke-width="2.5"/>
<text class="small" x="556" y="130" text-anchor="middle">outbound 443</text>
</svg>
