<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 362" width="960" height="362" role="img" aria-labelledby="t d">
<title id="t">Messaging your Telegram bot from a phone reaches the OpenClaw Gateway on 127.0.0.1:18789, because the Gateway connects out to api.telegram.org and collects the messages. There is no inbound door for the bot.</title>
<desc id="d">Messaging your Telegram bot from a phone reaches the OpenClaw Gateway on 127.0.0.1:18789, because the Gateway connects out to api.telegram.org and collects the messages. There is no inbound door for the bot.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c9cdd8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="362" rx="10" fill="#f4f5f7"/>
<rect class="card" x="36" y="67" width="112" height="120" rx="8"/>
<text class="label" x="92" y="113" text-anchor="middle">You</text>
<text class="small" x="92" y="133" text-anchor="middle">on a phone</text>
<text class="small" x="92" y="151" text-anchor="middle">Telegram app</text>
<rect class="card" x="250" y="98" width="250" height="58" rx="8"/>
<rect x="250" y="98" width="6" height="58" rx="3" fill="#000033"/>
<text class="mono" x="272" y="124">openclaw-ui.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="144">org login</text>
<text class="small" x="486" y="144" text-anchor="end">chapter 2</text>
<path d="M148 127 C 200 127, 200 127, 250 127" fill="none" stroke="#8a90a6" stroke-width="2" stroke-dasharray="5 4"/>
<rect class="card" x="612" y="40" width="340" height="174" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">UBUNTU GUEST</text>
<text class="monoxs" x="632" y="100">127.0.0.1:18789</text>
<text class="monoxs" x="758" y="100">OpenClaw Gateway</text>
<line x1="632" y1="114" x2="932" y2="114" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="132">no inbound door for the bot</text>
