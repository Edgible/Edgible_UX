<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" role="img" aria-labelledby="t d">
<title id="t">WhatsApp on a phone, paired as a linked device, reaches the OpenClaw Gateway on 127.0.0.1:18789 over the connection the Gateway opens outward, and the bound thread drives Cursor over ACP to edit the public Hello World page.</title>
<desc id="d">WhatsApp on a phone, paired as a linked device, reaches the OpenClaw Gateway on 127.0.0.1:18789 over the connection the Gateway opens outward, and the bound thread drives Cursor over ACP to edit the public Hello World page.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c2c8d8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="388" rx="10" fill="#e4e8f2"/>
<rect class="card" x="36" y="80" width="112" height="120" rx="8"/>
<text class="label" x="92" y="126" text-anchor="middle">You</text>
<text class="small" x="92" y="146" text-anchor="middle">on a phone</text>
<text class="small" x="92" y="164" text-anchor="middle">WhatsApp</text>
<rect class="card" x="250" y="111" width="250" height="58" rx="8"/>
<rect x="250" y="111" width="6" height="58" rx="3" fill="#000033"/>
<text class="mono" x="272" y="137">openclaw-ui.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="157">org login</text>
<text class="small" x="486" y="157" text-anchor="end">cannot bind</text>
<path d="M148 140 C 200 140, 200 140, 250 140" fill="none" stroke="#8a90a6" stroke-width="2" stroke-dasharray="5 4"/>
<rect class="card" x="612" y="40" width="340" height="200" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">UBUNTU GUEST</text>
<text class="monoxs" x="632" y="100">127.0.0.1:18789</text>
<text class="monoxs" x="758" y="100">OpenClaw Gateway</text>
<text class="monoxs" x="632" y="126">Cursor over ACP</text>
<text class="monoxs" x="758" y="126">edits ~/hello-world</text>
<line x1="632" y1="140" x2="932" y2="140" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="158">a linked device, not a business API</text>
<text class="small" x="632" y="184">the bound thread is the phone's</text>
<path d="M612 140 H512" fill="none" stroke="#000033" stroke-width="2.5"/>
<text class="small" x="556" y="130" text-anchor="middle">outbound 443</text>
<rect class="card" x="250" y="284" width="370" height="64" rx="8"/>
<text class="label" x="270" y="310">WhatsApp servers</text>
<text class="small" x="270" y="332">the linked device pairs over that connection</text>
<path d="M652 240 V316 H620" fill="none" stroke="#000033" stroke-width="2"/>
<text class="small" x="664" y="306">the Gateway connects out</text>
</svg>
