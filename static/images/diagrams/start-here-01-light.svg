<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 254" width="960" height="254" role="img" aria-labelledby="t d">
<title id="t">A phone on cellular opens hello-world.&lt;org&gt;.edgible.com, which is open to anyone. It arrives at nginx bound to 127.0.0.1:8081 on the Ubuntu guest, reached over the outbound connection the serving agent holds open, so the router has no forwarded port.</title>
<desc id="d">A phone on cellular opens hello-world.&lt;org&gt;.edgible.com, which is open to anyone. It arrives at nginx bound to 127.0.0.1:8081 on the Ubuntu guest, reached over the outbound connection the serving agent holds open, so the router has no forwarded port.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c2c8d8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="254" rx="10" fill="#e4e8f2"/>
<rect class="card" x="36" y="67" width="112" height="120" rx="8"/>
<text class="label" x="92" y="113" text-anchor="middle">Phone</text>
<text class="small" x="92" y="133" text-anchor="middle">cellular</text>
<text class="small" x="92" y="151" text-anchor="middle">Wi-Fi off</text>
<rect class="card" x="250" y="98" width="250" height="58" rx="8"/>
<rect x="250" y="98" width="6" height="58" rx="3" fill="#2f6fb0"/>
<text class="mono" x="272" y="124">hello-world.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="144">open to anyone</text>
<text class="small" x="486" y="144" text-anchor="end">this chapter</text>
<path d="M148 127 C 200 127, 200 127, 250 127" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<rect class="card" x="612" y="40" width="340" height="174" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">UBUNTU GUEST</text>
<text class="monoxs" x="632" y="100">127.0.0.1:8081</text>
<text class="monoxs" x="758" y="100">nginx, Hello World</text>
<line x1="632" y1="114" x2="932" y2="114" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="132">the serving agent holds the connection open</text>
<text class="small" x="632" y="158">router: no forwarded port</text>
<path d="M612 127 H512" fill="none" stroke="#000033" stroke-width="2.5"/>
<text class="small" x="556" y="117" text-anchor="middle">outbound 443</text>
</svg>
