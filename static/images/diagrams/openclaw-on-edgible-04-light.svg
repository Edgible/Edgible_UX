<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
<title id="t">Asking in chat, through the Control UI, Telegram or WhatsApp, reaches the OpenClaw Gateway on 127.0.0.1:18789, which runs the edgible skill and so the edgible CLI in your own org, on the box that serves your apps.</title>
<desc id="d">Asking in chat, through the Control UI, Telegram or WhatsApp, reaches the OpenClaw Gateway on 127.0.0.1:18789, which runs the edgible skill and so the edgible CLI in your own org, on the box that serves your apps.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c9cdd8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="280" rx="10" fill="#f4f5f7"/>
<rect class="card" x="36" y="80" width="112" height="120" rx="8"/>
<text class="label" x="92" y="126" text-anchor="middle">You</text>
<text class="small" x="92" y="146" text-anchor="middle">in chat:</text>
<text class="small" x="92" y="164" text-anchor="middle">UI, Telegram</text>
<text class="small" x="92" y="182" text-anchor="middle">or WhatsApp</text>
<rect class="card" x="250" y="111" width="250" height="58" rx="8"/>
<rect x="250" y="111" width="6" height="58" rx="3" fill="#000033"/>
<text class="mono" x="272" y="137">openclaw-ui.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="157">org login</text>
<text class="small" x="486" y="157" text-anchor="end">chapter 2</text>
<path d="M148 140 C 200 140, 200 140, 250 140" fill="none" stroke="#8a90a6" stroke-width="2" stroke-dasharray="5 4"/>
<rect class="card" x="612" y="40" width="340" height="200" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">UBUNTU GUEST</text>
<text class="monoxs" x="632" y="100">127.0.0.1:18789</text>
<text class="monoxs" x="758" y="100">OpenClaw Gateway</text>
<text class="monoxs" x="632" y="126">edgible skill</text>
<text class="monoxs" x="758" y="126">runs the edgible CLI</text>
<line x1="632" y1="140" x2="932" y2="140" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="158">the CLI acts in your own org</text>
<text class="small" x="632" y="184">the same box that serves your apps</text>
