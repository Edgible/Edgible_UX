<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
<title id="t">A friend on a phone opens mc-bedrock.&lt;org&gt;.edgible.com on UDP port 29132, open to anyone. It arrives at Geyser, mapped from 127.0.0.1:29132 to port 19132 in the container, which hands the player to the same Paper server as the Java players.</title>
<desc id="d">A friend on a phone opens mc-bedrock.&lt;org&gt;.edgible.com on UDP port 29132, open to anyone. It arrives at Geyser, mapped from 127.0.0.1:29132 to port 19132 in the container, which hands the player to the same Paper server as the Java players.</desc>
