<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-labelledby="t d">
<title id="t">You build several Edgible apps, write them as a card, add files such as tailor.sh, and publish the card. Someone else finds that card, tailors it for their machine, turns it into a stack file, and deploys the stack.</title>
<desc id="d">You build several Edgible apps, write them as a card, add files such as tailor.sh, and publish the card. Someone else finds that card, tailors it for their machine, turns it into a stack file, and deploys the stack.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff}.row{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#4a4f66;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c2c8d8;stroke-width:1.5}.step{cursor:help}</style>
<rect x="0" y="0" width="960" height="240" rx="10" fill="#e4e8f2"/>
<text class="row" x="32" y="38">YOU SHARE</text>
<g class="step"><title>Several apps, already published on Edgible. Each one has a port and an auth mode: None, org, or api-key. Apps that share a serving device share a place.</title>
<rect class="card" x="32" y="46" width="203" height="78" rx="8"/>
<circle cx="54" cy="74" r="12" fill="#2e4a9e"/>
<text class="head" x="54" y="79" text-anchor="middle">1</text>
<text class="label" x="74" y="79">Build the apps</text>
<text class="small" x="48" y="104">several Edgible apps</text>
</g>
<path d="M239 85 H251" fill="none" stroke="#000033" stroke-width="2"/>
<path d="M251 80 L259 85 L251 90" fill="none" stroke="#000033" stroke-width="2"/>
<g class="step"><title>One YAML file. It names the programs, the images, the ports, the auth modes, and which apps share a place. It leaves out your device name, your hostnames, your organization id, and any password.</title>
<rect class="card" x="263" y="46" width="203" height="78" rx="8"/>
<circle cx="285" cy="74" r="12" fill="#2e4a9e"/>
<text class="head" x="285" y="79" text-anchor="middle">2</text>
<text class="label" x="305" y="79">Write the card</text>
<text class="small" x="279" y="104">ports, auth, place</text>
</g>
<path d="M470 85 H482" fill="none" stroke="#000033" stroke-width="2"/>
<path d="M482 80 L490 85 L482 90" fill="none" stroke="#000033" stroke-width="2"/>
<g class="step"><title>Optional files beside the card: a Compose file, a sample page, and tailor.sh. The changes list says what to edit. The script applies that list and stops if an edit did not land.</title>
<rect class="card" x="494" y="46" width="203" height="78" rx="8"/>
<circle cx="516" cy="74" r="12" fill="#2e4a9e"/>
<text class="head" x="516" y="79" text-anchor="middle">3</text>
<text class="label" x="536" y="79">Add the files</text>
<text class="small" x="510" y="104">such as tailor.sh</text>
</g>
<path d="M701 85 H713" fill="none" stroke="#000033" stroke-width="2"/>
<path d="M713 80 L721 85 L713 90" fill="none" stroke="#000033" stroke-width="2"/>
<g class="step"><title>A maintainer merges a pull request into the cards repo. That merge is the publish. The pull request checks the card against the schema, and the directory name must match the card name. The maintainer decides whether the card belongs.</title>
<rect class="card" x="725" y="46" width="203" height="78" rx="8"/>
<circle cx="747" cy="74" r="12" fill="#2e4a9e"/>
<text class="head" x="747" y="79" text-anchor="middle">4</text>
<text class="label" x="767" y="79">Publish the card</text>
<text class="small" x="741" y="104">in the cards repo</text>
</g>
<text class="row" x="32" y="138">SOMEONE ELSE REUSES</text>
<g class="step"><title>Open the cards repo and read the card. The picture lists the apps, the ports, the auth modes, and the places. It names no device and no organization.</title>
<rect class="card" x="32" y="146" width="203" height="78" rx="8"/>
<circle cx="54" cy="174" r="12" fill="#2e4a9e"/>
<text class="head" x="54" y="179" text-anchor="middle">5</text>
<text class="label" x="74" y="179">Find the card</text>
<text class="small" x="48" y="204">in the cards repo</text>
</g>
<path d="M239 185 H251" fill="none" stroke="#000033" stroke-width="2"/>
<path d="M251 180 L259 185 L251 190" fill="none" stroke="#000033" stroke-width="2"/>
<g class="step"><title>Follow the card README. It fetches the Compose files and runs tailor.sh. You supply what is yours, such as an org label. The script does not store a device name, a hostname, or a password.</title>
<rect class="card" x="263" y="146" width="203" height="78" rx="8"/>
<circle cx="285" cy="174" r="12" fill="#2e4a9e"/>
<text class="head" x="285" y="179" text-anchor="middle">6</text>
<text class="label" x="305" y="179">Tailor it</text>
<text class="small" x="279" y="204">for your machine</text>
</g>
<path d="M470 185 H482" fill="none" stroke="#000033" stroke-width="2"/>
<path d="M482 180 L490 185 L482 190" fill="none" stroke="#000033" stroke-width="2"/>
<g class="step"><title>card-to-stack.py reads the card and writes a stack file. It fills in your device name and your organization id. Auth mode org is written edgible-login.</title>
<rect class="card" x="494" y="146" width="203" height="78" rx="8"/>
<circle cx="516" cy="174" r="12" fill="#2e4a9e"/>
<text class="head" x="516" y="179" text-anchor="middle">7</text>
<text class="label" x="536" y="179">Make the stack</text>
<text class="small" x="510" y="204">card-to-stack.py</text>
</g>
<path d="M701 185 H713" fill="none" stroke="#000033" stroke-width="2"/>
<path d="M713 180 L721 185 L713 190" fill="none" stroke="#000033" stroke-width="2"/>
<g class="step"><title>edgible stack deploy publishes the ports in that stack file. The processes are already listening. Deploy does not start the containers.</title>
<rect class="card" x="725" y="146" width="203" height="78" rx="8"/>
<circle cx="747" cy="174" r="12" fill="#2e4a9e"/>
<text class="head" x="747" y="179" text-anchor="middle">8</text>
<text class="label" x="767" y="179">Deploy</text>
<text class="small" x="741" y="204">edgible stack deploy</text>
</g>
</svg>
