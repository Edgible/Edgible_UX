<text class="small" x="92" y="146" text-anchor="middle">on cellular</text>
<text class="small" x="92" y="164" text-anchor="middle">no VPN</text>
<rect class="card" x="250" y="111" width="250" height="58" rx="8"/>
<rect x="250" y="111" width="6" height="58" rx="3" fill="#c3c6d8"/>
<text class="mono" x="272" y="137">openclaw-ui.&lt;org&gt;.edgible.com</text>
