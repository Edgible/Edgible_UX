<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 254" width="960" height="254" role="img" aria-labelledby="t d">
<title id="t">The OpenClaw Gateway on another box you own calls ollama.&lt;org&gt;.edgible.com with a bearer key and no /v1 suffix. It arrives at Ollama.app on the Mac, where gpt-oss:20b loads.</title>
<desc id="d">The OpenClaw Gateway on another box you own calls ollama.&lt;org&gt;.edgible.com with a bearer key and no /v1 suffix. It arrives at Ollama.app on the Mac, where gpt-oss:20b loads.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c2c8d8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="254" rx="10" fill="#e4e8f2"/>
<rect class="card" x="36" y="67" width="112" height="120" rx="8"/>
<text class="label" x="92" y="113" text-anchor="middle">OpenClaw</text>
<text class="small" x="92" y="133" text-anchor="middle">another box</text>
<text class="small" x="92" y="151" text-anchor="middle">you own</text>
<rect class="card" x="250" y="98" width="250" height="58" rx="8"/>
<rect x="250" y="98" width="6" height="58" rx="3" fill="#7a5cc0"/>
<text class="mono" x="272" y="124">ollama.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="144">bearer key</text>
<text class="small" x="486" y="144" text-anchor="end">no /v1 suffix</text>
<path d="M148 127 C 200 127, 200 127, 250 127" fill="none" stroke="#8a90a6" stroke-width="2" stroke-dasharray="5 4"/>
<rect class="card" x="612" y="40" width="340" height="174" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">MACOS HOST</text>
<text class="monoxs" x="632" y="100">0.0.0.0:11434</text>
<text class="monoxs" x="758" y="100">gpt-oss:20b loads here</text>
<text class="monoxs" x="632" y="126">serving agent</text>
<text class="monoxs" x="758" y="126">app ollama, api-key</text>
<line x1="632" y1="140" x2="932" y2="140" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="158">Authorization: Bearer, not an open port</text>
<path d="M612 127 H512" fill="none" stroke="#000033" stroke-width="2.5"/>
<text class="small" x="556" y="117" text-anchor="middle">outbound 443</text>
</svg>
