<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 366" width="960" height="366" role="img" aria-labelledby="t d">
<title id="t">A phone on cellular reaches four hostnames. The site and the Umami tracking script are open to anyone; the Umami dashboard and the Uptime Kuma status page need an org login. All four arrive at one machine you own, whose nginx, Umami and Uptime Kuma containers are bound to loopback, with no forwarded port.</title>
<desc id="d">A phone on cellular reaches four hostnames. The site and the Umami tracking script are open to anyone; the Umami dashboard and the Uptime Kuma status page need an org login. All four arrive at one machine you own, whose nginx, Umami and Uptime Kuma containers are bound to loopback, with no forwarded port.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c9cdd8;stroke-width:1.5}</style>
