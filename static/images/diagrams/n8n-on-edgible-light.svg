<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
<title id="t">A phone, and services like GitHub and Stripe, reach two hostnames. The n8n editor needs an org login; the webhook hostname is open to anyone. Both arrive at one n8n process bound to 127.0.0.1:5678 on a machine you own, with no forwarded port.</title>
<desc id="d">A phone, and services like GitHub and Stripe, reach two hostnames. The n8n editor needs an org login; the webhook hostname is open to anyone. Both arrive at one n8n process bound to 127.0.0.1:5678 on a machine you own, with no forwarded port.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c9cdd8;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="280" rx="10" fill="#f4f5f7"/>
<rect class="card" x="36" y="80" width="112" height="120" rx="8"/>
<text class="label" x="92" y="126" text-anchor="middle">Phone</text>
<text class="small" x="92" y="146" text-anchor="middle">and GitHub,</text>
<text class="small" x="92" y="164" text-anchor="middle">Stripe, curl</text>
<rect class="card" x="250" y="73" width="250" height="58" rx="8"/>
<rect x="250" y="73" width="6" height="58" rx="3" fill="#000033"/>
<text class="mono" x="272" y="99">n8n.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="119">org login</text>
<path d="M148 136 C 200 136, 200 102, 250 102" fill="none" stroke="#8a90a6" stroke-width="2" stroke-dasharray="5 4"/>
<rect class="card" x="250" y="149" width="250" height="58" rx="8"/>
<rect x="250" y="149" width="6" height="58" rx="3" fill="#2f6fb0"/>
<text class="mono" x="272" y="175">n8n-hooks.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="195">open to anyone</text>
<path d="M148 144 C 200 144, 200 178, 250 178" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<rect class="card" x="612" y="40" width="340" height="200" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">ONE MACHINE YOU OWN</text>
<text class="monoxs" x="632" y="100">127.0.0.1:5678</text>
<text class="monoxs" x="758" y="100">n8n, one process</text>
<line x1="632" y1="114" x2="932" y2="114" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="132">credentials stay in the container</text>
<text class="small" x="632" y="158">two hostnames, one port</text>
<text class="small" x="632" y="184">router: no forwarded port</text>
<path d="M612 140 H512" fill="none" stroke="#000033" stroke-width="2.5"/>
<text class="small" x="556" y="130" text-anchor="middle">outbound 443</text>
</svg>
