<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" width="720" height="516" role="img" aria-labelledby="t d">
<title id="t">The website card lists four apps and no hostnames. site is nginx serving your files on port 8080, open to anyone. analytics is the Umami tracking script on port 3000, open to anyone. umami is the Umami dashboard on that same port, with Postgres, behind an org login. status is Uptime Kuma on port 3001, behind an org login. The card names no device and no organization.</title>
