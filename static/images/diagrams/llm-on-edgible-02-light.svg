<rect class="card" x="36" y="67" width="112" height="120" rx="8"/>
<text class="label" x="92" y="113" text-anchor="middle">Any</text>
<text class="small" x="92" y="133" text-anchor="middle">off-box</text>
<text class="small" x="92" y="151" text-anchor="middle">client</text>
<rect class="card" x="250" y="98" width="250" height="58" rx="8"/>
<rect x="250" y="98" width="6" height="58" rx="3" fill="#7a5cc0"/>
<text class="mono" x="272" y="124">ollama.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="144">bearer key</text>
<text class="small" x="486" y="144" text-anchor="end">this chapter</text>
<path d="M148 127 C 200 127, 200 127, 250 127" fill="none" stroke="#8a90a6" stroke-width="2" stroke-dasharray="5 4"/>
<rect class="card" x="612" y="40" width="340" height="174" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="60">UBUNTU GUEST</text>
<text class="monoxs" x="632" y="100">socat</text>
<text class="monoxs" x="758" y="100">127.0.0.1:11434 here</text>
<text class="monoxs" x="632" y="126">serving agent</text>
<text class="monoxs" x="758" y="126">app ollama, api-key</text>
<line x1="632" y1="140" x2="932" y2="140" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="158">the guest only forwards</text>
<rect class="card" x="612" y="258" width="340" height="148" rx="8"/>
<path d="M620 258 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#2e4a9e"/>
<text class="head" x="632" y="278">MACOS HOST</text>
<text class="monoxs" x="632" y="318">0.0.0.0:11434</text>
<text class="monoxs" x="758" y="318">Ollama.app, Metal</text>
<line x1="632" y1="332" x2="932" y2="332" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="632" y="350">the weights and the GPU stay here</text>
<path d="M782 214 V258" fill="none" stroke="#000033" stroke-width="2" stroke-dasharray="5 4"/>
