<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="t d">
<title id="t">An off-box client calls ollama.&lt;org&gt;.edgible.com with a bearer key. It arrives at the serving agent on the Ubuntu guest, where socat forwards 127.0.0.1:11434 across the virt LAN to Ollama.app on the macOS host, so the weights and the GPU stay there.</title>
<desc id="d">An off-box client calls ollama.&lt;org&gt;.edgible.com with a bearer key. It arrives at the serving agent on the Ubuntu guest, where socat forwards 127.0.0.1:11434 across the virt LAN to Ollama.app on the macOS host, so the weights and the GPU stay there.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#000033}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#4a4f66}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#ffffff;stroke:#c9cdd8;stroke-width:1.5}</style>
