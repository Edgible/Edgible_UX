<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
<title id="t">A stranger anywhere opens site.&lt;org&gt;.edgible.com, open to anyone with no login. It arrives at nginx on 127.0.0.1:8080 on the Ubuntu guest, serving files that stay on your own disk, with no forwarded port.</title>
<desc id="d">A stranger anywhere opens site.&lt;org&gt;.edgible.com, open to anyone with no login. It arrives at nginx on 127.0.0.1:8080 on the Ubuntu guest, serving files that stay on your own disk, with no forwarded port.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#e7e7f0}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#a5a8bd}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:13px;fill:#e7e7f0}.monoxs{font-family:Iosevka,ui-monospace,monospace;font-size:12px;fill:#a5a8bd}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.card{fill:#22223c;stroke:#3a3a5c;stroke-width:1.5}</style>
<rect x="0" y="0" width="960" height="280" rx="10" fill="#1a1a2e"/>
<rect class="card" x="36" y="80" width="112" height="120" rx="8"/>
<text class="label" x="92" y="126" text-anchor="middle">A stranger</text>
<text class="small" x="92" y="146" text-anchor="middle">anywhere</text>
<text class="small" x="92" y="164" text-anchor="middle">no login</text>
<rect class="card" x="250" y="111" width="250" height="58" rx="8"/>
<rect x="250" y="111" width="6" height="58" rx="3" fill="#7db2e8"/>
<text class="mono" x="272" y="137">site.&lt;org&gt;.edgible.com</text>
<text class="small" x="272" y="157">open to anyone</text>
<text class="small" x="486" y="157" text-anchor="end">this chapter</text>
<path d="M148 140 C 200 140, 200 140, 250 140" fill="none" stroke="#7db2e8" stroke-width="2"/>
<rect class="card" x="612" y="40" width="340" height="200" rx="8"/>
<path d="M620 40 h324 a8 8 0 0 1 8 8 v22 h-340 v-22 a8 8 0 0 1 8 -8 z" fill="#3a56ad"/>
<text class="head" x="632" y="60">UBUNTU GUEST</text>
<text class="monoxs" x="632" y="100">127.0.0.1:8080</text>
<text class="monoxs" x="758" y="100">nginx</text>
<text class="monoxs" x="632" y="126">~/site/public</text>
<text class="monoxs" x="758" y="126">the files</text>
<line x1="632" y1="140" x2="932" y2="140" stroke="#33334f" stroke-width="1.5"/>
<text class="small" x="632" y="158">the files stay on your disk</text>
<text class="small" x="632" y="184">router: no forwarded port</text>
<path d="M612 140 H512" fill="none" stroke="#e7e7f0" stroke-width="2.5"/>
<text class="small" x="556" y="130" text-anchor="middle">outbound 443</text>
</svg>
