<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 254" width="960" height="254" role="img" aria-labelledby="t d">
<title id="t">n8n on another box you own calls ollama.&lt;org&gt;.edgible.com with a bearer key, the Basic LLM Chain node on the bare hostname and the AI Assistant chat on the /v1 path. Both arrive at Ollama.app on the Mac, published by the serving agent on that machine.</title>
<desc id="d">n8n on another box you own calls ollama.&lt;org&gt;.edgible.com with a bearer key, the Basic LLM Chain node on the bare hostname and the AI Assistant chat on the /v1 path. Both arrive at Ollama.app on the Mac, published by the serving agent on that machine.</desc>
