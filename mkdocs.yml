      - guides/openclaw-on-edgible/02-openclaw-on-the-box.md
      - guides/openclaw-on-edgible/03-publish-openclaw-control-ui.md
      - guides/openclaw-on-edgible/04-openclaw-changes-edgible-site.md
      - guides/openclaw-on-edgible/05-edgible-openclaw-skill.md
      - guides/openclaw-on-edgible/06-telegram-pocket-client.md
      - guides/openclaw-on-edgible/07-whatsapp-pocket-client.md
