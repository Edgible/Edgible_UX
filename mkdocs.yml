      - guides/n8n-on-edgible/01-n8n-on-the-vm.md
      - guides/n8n-on-edgible/02-n8n-editor-through-edgible.md
      - guides/n8n-on-edgible/03-n8n-webhook-door.md
      - guides/n8n-on-edgible/04-n8n-cron.md
      - guides/n8n-on-edgible/05-n8n-public-webhook.md
