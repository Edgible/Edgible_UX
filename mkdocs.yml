site_name: Edgible Guides
site_url: https://guides.edgible.com/
site_description: >-
  Hands-on guides for publishing self-hosted services with Edgible. Each chapter
  is one job with one smoke test: n8n with split auth modes, an OpenClaw Control
  UI reachable from a phone, and a self-hosted Ollama called by remote machines.
site_author: Edgible

repo_url: https://github.com/Edgible/Edgible_UX
repo_name: Edgible/Edgible_UX
edit_uri: edit/main/

# Populated by scripts/build.sh, which stages the canonical markdown from the
# repo root. Editing files under build/ has no effect.
docs_dir: build/docs
site_dir: site

# One page, one file: glossary.html rather than glossary/index.html. Every URL
# then maps straight onto an object key on a static host, with no rewrite rule
# to turn a directory path into its index. It also puts each page next to its
# own source, glossary.html beside glossary.md.
use_directory_urls: false

copyright: Copyright &copy; 2026 Edgible Pty Ltd.

theme:
  name: material
  custom_dir: overrides
  # Jost is self-hosted in static/fonts, so nothing is fetched from Google.
  font: false
  logo: images/edgible-logo-white.png
  favicon: images/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  # GitHub-compatible heading slugs, so anchors in the markdown resolve both on
  # github.com and on the built site.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  # The Verify lists are markdown task lists; without this they render as
  # literal "[ ]" text. Clickable so a reader can tick off each check.
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-markdown.js

extra:
  # Material links the header and drawer logo here. These guides are a satellite
  # of the main site, so the logo goes there rather than to this site's index.
  homepage: https://www.edgible.com
  # Rendered as two lines by overrides/partials/copyright.html so the footer
  # holds together on a phone.
  copyright_lines:
    - Copyright © 2026
    - Edgible Pty Ltd.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Edgible/Edgible_UX

nav:
  - Welcome: README.md
  - What Edgible does: capabilities.md
  - Glossary: glossary.md
  - Working with an AI tool: working-with-ai.md
  - Start here:
      - guides/start-here/README.md
      - guides/start-here/01-edgible-on-vm.md
  - Website on Edgible:
      - guides/website-on-edgible/README.md
      - guides/website-on-edgible/01-site-on-the-vm.md
      - guides/website-on-edgible/02-publish-the-site.md
      - guides/website-on-edgible/03-umami-on-the-vm.md
      - guides/website-on-edgible/04-publish-umami.md
      - guides/website-on-edgible/05-uptime-kuma.md
      - guides/website-on-edgible/06-website-teardown.md
  - n8n on Edgible:
