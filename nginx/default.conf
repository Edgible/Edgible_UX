server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/plain text/markdown text/html text/css application/javascript;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/(llms\.txt|llms-full\.txt)$ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=600";
    }

    # Material's own assets carry a content hash in the filename, so they can be
    # cached indefinitely: a change produces a new URL.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ours do not. extra.css, the logo and the fonts keep their names across
    # rebuilds, so a long max-age serves stale styling after a deploy.
    location ~* ^/(stylesheets|javascripts|images|fonts)/ {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        # $uri/index.html must come before $uri/: matching the bare directory
        # with autoindex off returns 403 instead of serving the index.
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 512;
}
