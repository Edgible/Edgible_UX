server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/plain text/markdown text/html text/css application/javascript;

    # Agents fetch the .md alongside the HTML, so it has to render in a browser
    # rather than download.
    types {
        text/markdown md;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/(llms\.txt|llms-full\.txt)$ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=600";
    }

    location ~* \.(css|js|woff2|svg|png|jpg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 512;
}
